# Config for scripts/run_binding_eval.py: the full result row on ZuCo.
defaults:
  - data: zuco_et
  - connector: mlp
  - anchor: standin
  - loss: infonce
  - _self_

seed: 42

# One entry per column of the result row, in the order they should be read.
# embed_dim must match what the encoder produces: 7 for the trivial features,
# the configured width for a learned encoder.
# The first column is the floor: an encoder that answers with noise, so its
# value is what the evaluation reports when nothing can be found. It is what
# the analytic chance level and the permutation null are checked against.
conditions:
  - name: noise
    encoder: noise
    embed_dim: 128
  - name: trivial
    encoder: trivial
    embed_dim: 7
  - name: random
    encoder: scanez
    embed_dim: 128

optimizer:
  lr: 0.001
  weight_decay: 0.0

training:
  max_steps: 300
  batch_size: 128
  log_every: 100

eval:
  folds: []            # empty runs every fold
  pool_size: 25
  tolerance: 3
  pool_seed: 0
  n_permutations: 1000
  permutation_seed: 0
  batch_size: 256
  headline_metric: recall@1

  # Extra controls. Each re-scores the run that already happened, so they cost
  # permutations rather than training time.
  within_subject_null: true    # shuffle only inside one reader's own trials
  decoy_test: true             # two candidates matched on count and word length
